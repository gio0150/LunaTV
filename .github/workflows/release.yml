name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          LUNA_KEYSTORE_BASE64: ${{ secrets.LUNA_KEYSTORE_BASE64 }}
          LUNA_STORE_PASSWORD: ${{ secrets.LUNA_STORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$LUNA_KEYSTORE_BASE64"
          mkdir -p local
          printf '%s' "$LUNA_KEYSTORE_BASE64" | base64 -d > local/luna-release.jks
          cat > local/independent-signing.properties <<EOF
          storeFile=luna-release.jks
          storePassword=$LUNA_STORE_PASSWORD
          keyAlias=$LUNA_KEY_ALIAS
          keyPassword=$LUNA_KEY_PASSWORD
          EOF
          chmod +x gradlew

      - name: Build release APK
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          VERSION="${VERSION#v}"
          CORE="${VERSION%%-*}"
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          if [ "$REST" = "$CORE" ]; then
            MINOR=0
            PATCH=0
          else
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            if [ "$PATCH" = "$REST" ]; then
              PATCH=0
            fi
          fi
          case "${MAJOR}${MINOR}${PATCH}" in
            *[!0-9]*)
              echo "release tag must be a numeric version such as v1.0.1" >&2
              exit 1
              ;;
          esac
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          ./gradlew assembleStandardRelease \
            -PlunaBrand \
            -PupdateRepo="$REPOSITORY" \
            -PversionName="$VERSION" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk \
            "dist/LunaTV-${VERSION}-standard.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Luna TV ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/LunaTV-*-standard.apk
